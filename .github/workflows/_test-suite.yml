name: Reusable Test Suite

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Automated Test Suite (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            constraints.txt
            requirements-dev.txt

      - name: Install system, Python, and Playwright dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sqlite3
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -c constraints.txt
          playwright install --with-deps chromium

      - name: Verify Python bytecode compilation
        run: |
          python -m py_compile *.py scripts/*.py

      - name: Run full automated test suite
        run: |
          pytest -v tests/

      - name: Run environment diagnostics
        run: |
          python scripts/diagnose.py --json
