name: CI

on:
  push:
    branches:
      - "feat/*"
      - "fix/*"
      - "refactor/*"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Suite
    uses: ./.github/workflows/_test-suite.yml
