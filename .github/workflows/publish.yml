name: Publish Docker Image (GHCR)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Tag/versão da imagem (ex: v1.5.0). Se vazio, utiliza a tag atual ou APP_VERSION."
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-publish:
    name: Test Suite & Publish to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system and Python test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sqlite3
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          playwright install --with-deps chromium

      - name: Verify Python bytecode compilation
        run: |
          python -m py_compile *.py scripts/*.py

      - name: Run full automated test suite
        run: |
          pytest -v tests/

      - name: Extract version metadata
        id: meta
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            RAW_VERSION="$INPUT_VERSION"
          elif [ "$REF_TYPE" = "tag" ]; then
            RAW_VERSION="$REF_NAME"
          else
            APP_VER="$(python3 -c 'import config; print(config.APP_VERSION)')"
            RAW_VERSION="v${APP_VER}"
          fi
          CLEAN_VERSION="${RAW_VERSION#v}"
          echo "raw_version=${RAW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "clean_version=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/nosremekk/lectoria:${{ steps.meta.outputs.raw_version }}
            ghcr.io/nosremekk/lectoria:${{ steps.meta.outputs.clean_version }}
            ghcr.io/nosremekk/lectoria:stable
          cache-from: type=gha
          cache-to: type=gha,mode=max
